name: Windows Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version from data/update_history.json"
        required: true
        type: string
  push:
    branches:
      - main
      - master
      - "codex/**"
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      SOLARIT_CI_GROUP_RUN: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate release version
        shell: pwsh
        run: |
          $version = '${{ inputs.version }}'
          $history = Get-Content data/update_history.json -Raw | ConvertFrom-Json
          if ([string]::IsNullOrWhiteSpace($version)) {
            if ($env:GITHUB_REF.StartsWith('refs/tags/v')) { $version = $env:GITHUB_REF_NAME -replace '^v', '' }
            else { $version = $history.current_version }
          }
          if ($history.current_version -ne $version) {
            throw "Workflow version $version does not match data/update_history.json ($($history.current_version))."
          }
          "SOLARIT_VERSION=$version" >> $env:GITHUB_ENV

      - name: Install Godot 4.7.2 console
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'godot-console.zip'
          $url = 'https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_win64.exe.zip'
          Invoke-WebRequest -Uri $url -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath (Join-Path $PWD 'tools') -Force
          $engine = Get-ChildItem tools -Filter '*win64_console.exe' | Select-Object -First 1
          if ($null -eq $engine) { throw 'Godot console executable was not found in the official archive.' }
          if ($engine.Name -ne 'Godot_v4.7.2-stable_win64_console.exe') {
            Move-Item -LiteralPath $engine.FullName -Destination (Join-Path $PWD 'tools\Godot_v4.7.2-stable_win64_console.exe') -Force
          }

      - name: Install export template
        run: python tools/fetch_windows_template.py

      - name: Import project and register script classes
        shell: pwsh
        run: |
          & .\tools\Godot_v4.7.2-stable_win64_console.exe --headless --editor --path . --quit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install regression image tooling
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt

      - name: Record regression runner environment
        shell: pwsh
        run: .\tools\write_ci_environment.ps1

      - name: Prepare regression diagnostics
        shell: pwsh
        run: |
          Remove-Item -LiteralPath test-output/ci/regression-summary.json,test-output/ci/regression-summary.txt,test-output/ci/CI-FAILURE-CONTEXT.txt -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force test-output/ci/logs | Out-Null

      - name: Run core regression
        shell: pwsh
        run: .\Test-Solarit.ps1 -CI -Group Core

      - name: Run simulation regression
        shell: pwsh
        run: .\Test-Solarit.ps1 -CI -Group Simulation

      - name: Run gameplay regression
        shell: pwsh
        run: .\Test-Solarit.ps1 -CI -Group Gameplay

      - name: Run save-load regression
        shell: pwsh
        run: .\Test-Solarit.ps1 -CI -Group SaveLoad

      - name: Run profile/highscore regression
        shell: pwsh
        run: .\Test-Solarit.ps1 -CI -Group ProfileHighscore

      - name: Run mission regression
        shell: pwsh
        run: .\Test-Solarit.ps1 -CI -Group Mission

      - name: Run multiplayer regression
        shell: pwsh
        run: .\Test-Solarit.ps1 -CI -Group Multiplayer

      - name: Run audio regression
        shell: pwsh
        run: .\Test-Solarit.ps1 -CI -Group Audio

      - name: Run UI regression
        shell: pwsh
        run: .\Test-Solarit.ps1 -CI -Group UI

      - name: Run visual regression
        shell: pwsh
        run: .\Test-Solarit.ps1 -CI -Group Visual

      - name: Run renderer/cache regression
        shell: pwsh
        run: .\Test-Solarit.ps1 -CI -Group RendererCache

      - name: Run performance regression
        shell: pwsh
        run: .\Test-Solarit.ps1 -CI -Group Performance

      - name: Upload regression diagnostics and visual artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solarit-regression-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          path: |
            test-output/ci/**
            test-output/**/*.png
            test-output/**/*.jpg
            test-output/**/*.webp

      - name: Embed release channel
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $channel = @{ format_version = 1; repository = 'DieListe01/ASHLINE-Releases'; installer_prefix = 'SOLARIT-RANDSEKTOR-07-Setup-'; check_interval_hours = 24 }
          $channel | ConvertTo-Json | Set-Content -Encoding utf8 data/update_channel.json

      - name: Export Windows game
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          & .\tools\Godot_v4.7.2-stable_win64_console.exe --headless --path . --export-release 'Windows Desktop' build/SOLARIT-RANDSEKTOR-07.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\tools\Godot_v4.7.2-stable_win64_console.exe --headless --path . --script tools/write_engine_notices.gd
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          (Get-Content docs/Spielstart.txt -Raw).Replace('@VERSION@', $env:SOLARIT_VERSION) | Set-Content -Encoding utf8 build/Spielstart.txt

      - name: Build portable archives
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: python tools/package_release.py $env:SOLARIT_VERSION

      - name: Package external-address API update
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $stage = Join-Path $PWD 'build\network-address-api-update'
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item server/solarit_api.py (Join-Path $stage 'solarit_api.py')
          Copy-Item server/UPDATE-NETWORK-ADDRESS-API.md (Join-Path $stage 'UPDATE-NETWORK-ADDRESS-API.md')
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath "build/SOLARIT-Network-Address-API-Update-$env:SOLARIT_VERSION.zip" -Force

      - name: Build per-user installer
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $compiler)) { $compiler = Join-Path $env:ProgramFiles 'Inno Setup 6\ISCC.exe' }
          if (-not (Test-Path $compiler)) { throw 'Inno Setup compiler was not found.' }
          & $compiler "/DAppVersion=$env:SOLARIT_VERSION" installer/SOLARIT-RANDSEKTOR-07.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Create verified release manifest
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $installer = Get-ChildItem build -Filter "SOLARIT-RANDSEKTOR-07-Setup-$env:SOLARIT_VERSION.exe" | Select-Object -First 1
          if ($null -eq $installer) { throw 'Installer output is missing.' }
          $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest = @{ version = $env:SOLARIT_VERSION; installer = $installer.Name; sha256 = $hash }
          $manifest | ConvertTo-Json | Set-Content -Encoding utf8 "build/SOLARIT-RANDSEKTOR-07-$env:SOLARIT_VERSION-release.json"
          "$hash  $($installer.Name)" | Set-Content -Encoding ascii "$($installer.FullName).sha256"
          $history = Get-Content data/update_history.json -Raw | ConvertFrom-Json
          $entry = $history.entries | Where-Object { $_.version -eq $env:SOLARIT_VERSION } | Select-Object -First 1
          if ($null -eq $entry) { throw 'Release notes are missing from data/update_history.json.' }
          $notes = "# SOLARIT: RANDSEKTOR 07 $($entry.version) — $($entry.title)`n`n" + (($entry.changes | ForEach-Object { "- $_" }) -join "`n")
          Set-Content -Path 'build/release-notes.md' -Value $notes -Encoding utf8

      - name: Publish installer to public release feed
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.ASHLINE_RELEASE_TOKEN }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN)) {
            throw 'Add the ASHLINE_RELEASE_TOKEN Actions secret. It needs Contents: Read and write access to DieListe01/ASHLINE-Releases.'
          }
          gh release create "v$env:SOLARIT_VERSION" --repo DieListe01/ASHLINE-Releases `
            "build/SOLARIT-RANDSEKTOR-07-Setup-$env:SOLARIT_VERSION.exe" `
            "build/SOLARIT-RANDSEKTOR-07-Setup-$env:SOLARIT_VERSION.exe.sha256" `
            "build/SOLARIT-RANDSEKTOR-07-$env:SOLARIT_VERSION-release.json" `
            "build/SOLARIT-Network-Address-API-Update-$env:SOLARIT_VERSION.zip" `
            --title "SOLARIT: RANDSEKTOR 07 $env:SOLARIT_VERSION" --notes-file 'build/release-notes.md'
